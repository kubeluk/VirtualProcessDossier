server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # These values are substituted at container startup; nginx variables stay intact.
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization "${FUSEKI_AUTHORIZATION}";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;

    # SPA fallback — all routes handled by Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy SPARQL queries to Jena Fuseki
    location = /sparql {
        proxy_pass ${FUSEKI_PROXY_TARGET}/${FUSEKI_DATASET}/sparql;
    }

    location = /update {
        proxy_pass ${FUSEKI_PROXY_TARGET}/${FUSEKI_DATASET}/update;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
